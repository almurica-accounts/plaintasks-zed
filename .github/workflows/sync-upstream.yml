name: Sync upstream monthly

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git and fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cseelus/plaintasks-zed.git
          git fetch upstream main

      - name: Merge upstream into fork
        run: |
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            echo "::error::Merge conflict syncing upstream. Resolve manually with 'git sync-upstream'."
            git merge --abort || true
            exit 1
          fi
