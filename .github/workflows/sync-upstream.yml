name: Sync upstream monthly

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      simulate_conflict:
        description: "Test only: merge the test-conflict branch instead of upstream"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git and fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cseelus/plaintasks-zed.git
          git fetch upstream main
          REF=upstream/main
          if [ "${{ inputs.simulate_conflict }}" = "true" ]; then
            git fetch origin test-conflict
            REF=origin/test-conflict
          fi
          echo "$REF" > merge-ref.txt

      - name: Merge upstream into fork
        id: merge
        run: |
          REF=$(cat merge-ref.txt)
          echo "Merging $REF"
          if git merge --no-edit "$REF"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflict detected in:"
            git diff --name-only --diff-filter=U
            git diff --name-only --diff-filter=U > conflict-files.txt
          fi

      - name: Resolve conflicts with OpenCode
        if: steps.merge.outputs.conflict == 'true'
        run: |
          npm install --global @opencode/cli
          files=$(tr '\n' ' ' < conflict-files.txt)
          timeout 10m opencode run --standalone --auto --agent conflict-resolver \
            --model opencode/deepseek-v4.1-flash-free#high \
            "Resolve the git merge conflicts in this repository. Conflicted files: $files. We are merging upstream/main into our fork's main. Preserve BOTH upstream improvements and our local customizations (date resolution, archive action, expanded tag completion). Use shell commands to inspect the conflict markers, edit the files, run 'git add' on resolved files, then 'git commit --no-edit' to finish the merge. Do NOT push. Do NOT use --force. Keep changes minimal and do not touch unrelated files."

      - name: Verify and push
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Conflicts remain after agent resolution"
            exit 1
          fi
          git push origin main
